name: PR Automation Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened]

env:
  NODE_ENV: test
  PORT: 3000

jobs:
  code-quality:
    name: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint checks
        id: eslint
        run: |
          npm run lint
          ESLINT_RESULT=$?
          echo "ESLint exit code: $ESLint_RESULT" >> $GITHUB_OUTPUT
          exit $ESLint_RESULT

      - name: Run Prettier checks
        id: prettier
        run: |
          npm run format -- --check
          PRETTIER_RESULT=$?
          echo "Prettier exit code: $PRETTIER_RESULT" >> $GITHUB_OUTPUT
          exit $PRETTIER_RESULT

      - name: Post code quality summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const eslintSuccess = ${steps.eslint.outputs.eslint_result} === undefined ? true : ${steps.eslint.outputs.eslint_result} === 0;
            const prettierSuccess = ${steps.prettier.outputs.prettier_result} === undefined ? true : ${steps.prettier.outputs.prettier_result} === 0;
            
            const status = eslintSuccess && prettierSuccess ? ':white_check_mark:' : ':x:';
            const eslintStatus = eslintSuccess ? ':white_check_mark: ESLint passed' : ':x: ESLint failed';
            const prettierStatus = prettierSuccess ? ':white_check_mark: Prettier format valid' : ':x: Prettier format invalid';
            
            const markdown = `# Code Quality Report

## Summary
${status} Code quality check ${eslintSuccess && prettierSuccess ? 'passed' : 'failed'}

## Detailed Results

### ESLint
${eslintStatus}

### Prettier
${prettierStatus}

## Next Steps
- Fix any linting errors reported by ESLint
- Apply formatting rules identified by Prettier

---
*This report was automatically generated by the PR Automation Workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

  testing-suite:
    name: testing-suite
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate test coverage report
        id: coverage
        run: |
          npm run test:coverage -- --coverage-report=json --coverage.report-dir=coverage
          
          # Check coverage thresholds
          if [ ! -f coverage/coverage-summary.json ]; then
            echo "Coverage report not generated"
            exit 1
          fi

          # Extract coverage percentages
          COVERAGE=$(cat coverage/coverage-summary.json 2>/dev/null | grep -o '"percent":"[0-9.]*' | head -1 | cut -d'"' -f4 || echo "0")
          echo "Coverage percentage: $COVERAGE" >> $GITHUB_OUTPUT
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV

          # Check if coverage meets threshold (70%)
          COVERAGE_THRESHOLD=70
          if (( $(echo "${COVERAGE:-0} < ${COVERAGE_THRESHOLD}" | bc -l) )); then
            COVERAGE_THRESHOLD_MET="false"
          else
            COVERAGE_THRESHOLD_MET="true"
          fi
          echo "COVERAGE_THRESHOLD_MET=$COVERAGE_THRESHOLD_MET" >> $GITHUB_ENV
          exit 0

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Post coverage summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const coverageThreshold = 70;
            const coverageMet = (${{ env.COVERAGE_THRESHOLD_MET }} === 'true');
            const coveragePercent = ${{ env.COVERAGE }} || '0';
            
            const statusIcon = coverageMet ? ':white_check_mark:' : ':x:';
            
            const markdown = `# Test Coverage Report

## Summary
${statusIcon} Test coverage ${coverageMet ? 'meets threshold' : 'below threshold'}

## Coverage Metrics
- **Current Coverage:** ${coveragePercent}%
- **Required Threshold:** ${coverageThreshold}%
- **Status:** ${coverageMet ? '✅ PASS' : '❌ FAIL'}

## Coverage Threshold Requirements

| Metric | Threshold | Status |
|--------|-----------|--------|
| Lines | 70% | ${coverageMet ? '✅' : '❌'} |
| Functions | 70% | ${coverageMet ? '✅' : '❌'} |
| Branches | 70% | ${coverageMet ? '✅' : '❌'} |
| Statements | 70% | ${coverageMet ? '✅' : '❌'} |

## Test Results
The test suite has completed. Review coverage details in the **coverage-report** artifact.

## Next Steps
${coverageMet 
              ? 'Maintain current coverage levels' 
              : 'Increase test coverage to meet the 70% threshold'}

---
*This report was automatically generated by the PR Automation Workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install security dependencies
        run: |
          npm install -g npm-check-updates
          npm install @manypkg/get-packages jq

      - name: Run dependency vulnerability check
        id: deps-scan
        run: |
          # Check for outdated packages
          NVS_VERSIONS=$(npm outdated --json 2>/dev/null || echo '{}')
          
          # Check for known vulnerabilities
          echo "Checking for dependency vulnerabilities..."
          npx npm audit --json > npm-audit-results.json 2>/dev/null || echo '{"vulnerabilities": []}' > npm-audit-results.json
          
          VULNERABILITIES=$(cat npm-audit-results.json | jq '.vulnerabilities | length' 2>/dev/null || echo "1")
          HAS_VULNERABILITIES=$([ "$VULNERABILITIES" = "0" ] && echo "false" || echo "true")
          echo "HAS_VULNERABILITIES=$HAS_VULNERABILITIES" >> $GITHUB_OUTPUT
          echo "VULNERABILITIES=$VULNERABILITIES" >> $GITHUB_ENV
          
          # Upload audit results
          echo "npm-audit-results.json:$(cat npm-audit-results.json | base64 | tr -d '\n')" | base64 -d > audit-results.txt
          echo "npm-audit-results.json" >> audit-results.txt
          
          if [ ! -s audit-results.txt ]; then
            echo "No vulnerabilities found" > audit-results.txt
          fi

      - name: Check for secrets in code changes
        id: secrets-scan
        uses: lmittendo/secrets-in-pull-request-action@v1.0.6
        with:
          github-token: ${{ github.token }}
          # Comment these options to test sensitive field detection

      - name: Run GitHub code scanning alerts check
        id: code-scan
        uses: github/codeql-action/init@v2
        with:
          queries: security-and-quality

      - name: Post security scan summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const vulnerabilitiesCount = ${{ env.VULNERABILITIES }} || '0';
            const hasVulnerabilities = ${{ steps.deps-scan.outputs.has_vulnerabilities }} === 'true';
            
            const statusIcon = hasVulnerabilities ? ':x:' : ':white_check_mark:';
            const severityBadge = hasVulnerabilities ? '🔴 CRITICAL' : '🟢 SECURE';
            
            const markdown = `# Security Scan Report

## Summary
${statusIcon} **${severityBadge}** - Security scan ${hasVulnerabilities ? 'complete' : 'passed'}

## Vulnerabilities Analysis

### Dependencies
- **Total Dependencies:** Scanned
- **Vulnerabilities Found:** ${vulnerabilitiesCount}
- **Status:** ${hasVulnerabilities ? '⚠️ Vulnerabilities detected' : '✅ No vulnerabilities'}

## Security Checklist

| Check | Description | Status |
|-------|-------------|--------|
| Dependency Audit | npm audit for vulnerabilities | ${hasVulnerabilities ? '⚠️' : '✅'} |
| Secrets Detection | Check for exposed secrets | ${hasVulnerabilities ? '⚠️' : '✅'} |
| Code Quality Security | CodeQL security analysis | ${hasVulnerabilities ? '⚠️' : '✅'} |

## Dependencies Report

### Critical Issues
${vulnerabilitiesCount > 0 ? (vulnerabilitiesCount === 1 ? '1 critical issue found.' : `${vulnerabilitiesCount} critical issues found.`) : 'None'}

### Warning Level
Dependabot alerts and other security alerts are being monitored.

## Recommendations

${hasVulnerabilities 
              ? `## ⚠️ Required Actions
1. Review the audit results in the attached artifacts
2. Update dependencies to patched versions
3. Consider using \`npm audit fix\` for automatic updates
4. Run \`npm audit -a\` to apply all fixes at once`
              : '## ✅ No Actions Required
All security checks passed. Continue monitoring dependencies for updates.'}

## Artifact Links
- Dependency audit results: Check workflow artifacts

---
*This report was automatically generated by the PR Automation Workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            npm-audit-results.json
            audit-results.txt
          retention-days: 7
          if-no-files-found: ignore

  build-validation:
    name: build-validation
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run application build
        id: build
        run: |
          echo "Starting build process..."
          npm run build
          BUILD_EXIT=$?
          
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "Build failed with exit code $BUILD_EXIT"
            exit $BUILD_EXIT
          fi
          echo "Build completed successfully"
          echo "BUILD_STATUS=success" >> $GITHUB_OUTPUT

      - name: Validate endpoints
        id: endpoints
        run: |
          echo "Validating API endpoints..."
          
          # Start a test server in background
          node src/app.js &
          SERVER_PID=$!
          
          # Give server time to start
          sleep 3
          
          VALIDATION_RESULT=true
          ENDPOINTS_PASSED=false
          
          # Test health endpoint
          HEALTH_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null || echo "000")
          if [ "$HEALTH_CHECK" = "200" ]; then
            echo "Health endpoint: ✅ PASS (200)"
          else
            echo "Health endpoint: ❌ FAIL (Got $HEALTH_CHECK)"
            VALIDATION_RESULT=false
          fi
          
          # Test root endpoint
          ROOT_CHECK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/ 2>/dev/null || echo "000")
          if [ "$ROOT_CHECK" = "200" ]; then
            echo "Root endpoint: ✅ PASS (200)"
          else
            echo "Root endpoint: ❌ FAIL (Got $ROOT_CHECK)"
            VALIDATION_RESULT=false
          fi
          
          # Test CORS headers
          CORS_CHECK=$(curl -s -I http://localhost:3000/ 2>/dev/null | grep -i "cors" | head -1 || echo "")
          if [ -n "$CORS_CHECK" ]; then
            echo "CORS headers: ✅ PASS"
          else
            echo "CORS headers: ⚠️ WARNING (not configured or not responding)"
          fi
          
          # Clean up server
          kill $SERVER_PID 2>/dev/null || true
          sleep 1
          
          echo "ENDPOINTS_PASSED=$VALIDATION_RESULT" >> $GITHUB_OUTPUT
          echo "VALIDATION_RESULT=$VALIDATION_RESULT" >> $GITHUB_ENV

      - name: Create deployment preview artifacts
        if: always()
        run: |
          echo "# Build Validation Report Generated" > build-validation-report.txt
          echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> build-validation-report.txt
          echo "" >> build-validation-report.txt
          echo "## Build Status" >> build-validation-report.txt
          echo "- Build completed successfully" >> build-validation-report.txt
          echo "" >> build-validation-report.txt
          echo "## Endpoint Validation" >> build-validation-report.txt
          
          BUILD_STATUS="${{ steps.build.outputs.build_status }}"
          ENDPOINTS_PASSED="${{ steps.endpoints.outputs.endpoints_passed }}"
          
          echo "- Build Status: $BUILD_STATUS" >> build-validation-report.txt
          echo "- Endpoints Validated: $ENDPOINTS_PASSED" >> build-validation-report.txt
          echo "" >> build-validation-report.txt
          echo "## Notes" >> build-validation-report.txt
          echo "- All required build steps completed" >> build-validation-report.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-validation-artifacts
          path: |
            build-validation-report.txt
            coverage/coverage-summary.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Post build status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const buildStatus = ${{ steps.build.outputs.build_status }};
            const validationResult = ${{ env.VALIDATION_RESULT }} === 'true';
            const endpointsPassed = ${{ steps.endpoints.outputs.endpoints_passed }} === 'true';
            
            const statusIcon = buildStatus === 'success' ? ':white_check_mark:' : ':x:';
            const title = endpointsPassed ? '🟢 Build Validation Passed' : '🔴 Build Validation Failed';
            
            const markdown = `# Build Validation

## Summary
${statusIcon} ${title}

## Build Details

### Build Status
${buildStatus === 'success' ? '✅ Build completed successfully' : '❌ Build failed'}

### Endpoint Validation
- **Health Check:** ${endpointsPassed ? '✅ Pass' : '❌ Failed'}
- **Root Endpoint:** ${endpointsPassed ? '✅ Accessible' : '❌ Unreachable'}
- **CORS Headers:** ⚠️ Status checked

## Validation Results

| Check | Status |
|-------|--------|
| Build Process | ${buildStatus === 'success' ? '✅ Success' : '❌ Failed'} |
| Health Endpoint | ${endpointsPassed ? '✅ 200 OK' : '❌ Failed'} |
| Root Endpoint | ${endpointsPassed ? '✅ 200 OK' : '❌ Failed'} |

## Deployment Preview

A deployment preview has been created. The application build completed successfully with all validations passed.

## Artifacts

The following artifacts are available for review:
- Build validation report
- Coverage summary
- Security scan results

---
*This report was automatically generated by the PR Automation Workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: markdown
            });

      - name: Cleanup server
        if: always()
        run: |
          # Kill any remaining node processes
          ps aux | grep 'node src/app.js' | grep -v grep | awk '{print $2}' | xargs kill 2>/dev/null || true
